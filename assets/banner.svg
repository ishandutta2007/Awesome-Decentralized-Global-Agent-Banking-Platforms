<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #38bdf8;
    }
    /* Subtle CSS Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite 2s;
      transform-origin: 1000px 320px;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Z-index behind text) -->
  <g id="dynamic-background">
    <!-- Ambient glowing orbs -->
    <circle class="orb-1" cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="orb-2" cx="1020" cy="310" r="160" fill="#6366f1" filter="url(#softGlow)" />
    <circle cx="600" cy="210" r="90" fill="#a855f7" opacity="0.15" filter="url(#softGlow)" />

    <!-- Isometric Network Grid Lines -->
    <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
      <line x1="0" y1="70" x2="1200" y2="70" />
      <line x1="0" y1="140" x2="1200" y2="140" />
      <line x1="0" y1="210" x2="1200" y2="210" />
      <line x1="0" y1="280" x2="1200" y2="280" />
      <line x1="0" y1="350" x2="1200" y2="350" />
      <line x1="150" y1="0" x2="150" y2="420" />
      <line x1="350" y1="0" x2="350" y2="420" />
      <line x1="550" y1="0" x2="550" y2="420" />
      <line x1="750" y1="0" x2="750" y2="420" />
      <line x1="950" y1="0" x2="950" y2="420" />
      <line x1="1150" y1="0" x2="1150" y2="420" />
    </g>

    <!-- Animated Data Flowing Curve -->
    <path d="M 50 340 Q 300 290 600 350 T 1150 290" fill="none" stroke="url(#primaryGlow)" stroke-width="2.5" opacity="0.4" stroke-dasharray="12 8">
      <animate attributeName="stroke-dashoffset" values="200;0" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 80 80 Q 400 130 750 60 T 1120 110" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="0;140" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Animated Floating Constellation Particles -->
    <g>
      <circle class="particle-1" cx="120" cy="180" r="4" fill="#38bdf8" filter="url(#glow)" />
      <circle class="particle-2" cx="260" cy="320" r="3" fill="#818cf8" />
      <circle class="particle-3" cx="1060" cy="130" r="5" fill="#c084fc" filter="url(#glow)" />
      <circle class="particle-1" cx="940" cy="80" r="3.5" fill="#34d399" />
      <circle class="particle-2" cx="1120" cy="240" r="4" fill="#38bdf8" />
      <circle class="particle-3" cx="80" cy="300" r="3" fill="#a78bfa" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed high contrast, clean visibility -->
  <g id="foreground-content">
    <!-- Top Status Badge Pill -->
    <g transform="translate(425, 42)">
      <rect width="350" height="34" rx="17" fill="#0f172a" stroke="url(#badgeGlow)" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="22" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM INDEX • 2026</text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="600" y="145" text-anchor="middle">
      Awesome Decentralized Global Agent Banking
    </text>

    <!-- Subtitle / Tagline -->
    <text class="subtitle-text" x="600" y="190" text-anchor="middle">
      Autonomous AI Identity • Scoped Spend Authorization • Stablecoin Liquidity Settlement
    </text>

    <!-- Functional Capability Pills (Foreground Cards) -->
    <g transform="translate(140, 240)">
      <!-- Card 1: Agent Identity -->
      <g transform="translate(0, 0)">
        <rect width="210" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="210" height="4" rx="2" fill="#38bdf8" />
        <text class="pill-text" x="20" y="32">🤖 Agent Identity</text>
        <text font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" x="20" y="54">KYA, JWT &amp; ERC-7710</text>
      </g>

      <!-- Card 2: Spend Governance -->
      <g transform="translate(235, 0)">
        <rect width="210" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="210" height="4" rx="2" fill="#6366f1" />
        <text class="pill-text" x="20" y="32">🛡️ Spend Policy Engine</text>
        <text font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" x="20" y="54">Hard Caps &amp; Dynamic Approval</text>
      </g>

      <!-- Card 3: Virtual & Smart Rails -->
      <g transform="translate(470, 0)">
        <rect width="210" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="210" height="4" rx="2" fill="#a855f7" />
        <text class="pill-text" x="20" y="32">💳 Virtual &amp; Smart Cards</text>
        <text font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" x="20" y="54">Rain, Crossmint &amp; Safe</text>
      </g>

      <!-- Card 4: Machine Settlement -->
      <g transform="translate(705, 0)">
        <rect width="210" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
        <rect x="0" y="0" width="210" height="4" rx="2" fill="#10b981" />
        <text class="pill-text" x="20" y="32">⚡ Machine Settlement</text>
        <text font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" x="20" y="54">x402 Protocol &amp; USDC 24/7</text>
      </g>
    </g>

    <!-- Bottom Protocol Footer Pills -->
    <g transform="translate(370, 360)">
      <text font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748b" x="0" y="14">POWERED BY STANDARDS:</text>
      <text font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" x="180" y="14">HTTP x402</text>
      <circle cx="255" cy="10" r="3" fill="#334155" />
      <text font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#818cf8" x="270" y="14">KYAPay</text>
      <circle cx="330" cy="10" r="3" fill="#334155" />
      <text font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#c084fc" x="345" y="14">ERC-4337</text>
      <circle cx="420" cy="10" r="3" fill="#334155" />
      <text font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#34d399" x="435" y="14">MCP Payments</text>
    </g>
  </g>
</svg>
